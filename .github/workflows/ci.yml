name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: store-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres store_restore
        env:
          PGPASSWORD: postgres
      - run: PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres store_browser
        env:
          PGPASSWORD: postgres
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/store_test
          STORE_RESTORE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/store_restore
          BROWSER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/store_browser
